SDG_GOAL: 14 Conserve marine resources
SDG_TARGET: 14.3 Introduction of effective regulation of marine biological resources extraction
SDG_INDICATOR: 14.3.1 Share of caught aquatic biological resources in the total volume of established limits, percent
UNIT_MEASURE: Percent (%)
CONTACT_ORGANISATION: State Agency of Ukraine for the Development of Melioration, Fisheries and Food Programs (Derzhrybagentstvo)
REC_USE_LIM: 'Note: Share of caught aquatic biological resources in the total volume of established limits is "−" as a result of the lack of catching aquatic bioresources due to one or another circumstance, or the method of using aquatic bioresources was not limited. <br> 2015–2016: Data have been developed since 2017. <br> 2022–2025: Limits for the special use of aquatic biological resources of national importance in the Sea of Azov with bays for commercial fishing and experimental fishing for 2025 have not been determined. Since 2022, the Sea of Azov has remained closed to Ukrainian fishing, and illegal fishing is carried out by the occupiers. Fishing of aquatic biological resources in the Sea of Azov will be possible only after the deoccupation of the territories. <br> 2022–2025: Since 2022, in connection with the introduction of martial law in Ukraine, in order to ensure the safety of navigation, minimize the risks of sabotage and terrorist threats from the sea, and prevent the death or injury of fishermen and the civilian population, commercial fishing in the Black Sea and in part of the Dnieper-Bug estuary system (within the Kherson region) has been blocked. <br> 2024–2025: Limits for the special use of aquatic biological resources of national importance in the Budatsky (Shabolatsky) estuary for commercial fishing and experimental fishing for 2024−2025 were not established. <br> 2022–2025: Limits for the special use of aquatic biological resources of national importance in the Tuzlov group of estuaries for commercial fishing and experimental fishing for 2022−2025 were not established. <br> 2025: In accordance with the Orders of the Ministry of Agrarian Policy dated 31.10.2024 No. 4039 "On approval of limits for the special use of aquatic biological resources of national importance in fishery water bodies (their parts) (except for the Azov and Black Seas with bays, Black Sea estuaries, the Danube River, the lower reaches of the Dniester River (with lakes, the Turunchuk arm) and the Dniester Estuary) for commercial fishing and experimental fishing for 2025" and dated 31.10.2024 No. 4040 "On approval of limits for the special use of aquatic biological resources of national importance in the Black Sea with bays, Black Sea estuaries, the Danube River, the lower reaches of the Dniester River (with lakes, the Turunchuk arm) and the Dniester estuary for commercial fishing and experimental fishing for 2025" aquatic bioresources gostronis, loban and singil are listed as mullet (gostronis, loban, singil). <br> At the same time, in 2025, limits for the special use of aquatic bioresources were approved in the Tyligulsky estuary for Black Sea hamsa, in the Berezansky estuary − taranya (common gossip), Black Sea hamsa and silver crucian carp, in the lower reaches of the Dniester with lakes and the Dniester estuary − sandy atherina and shrimp, in the Dnieper-Bug estuary system − common bruise, in the Black Sea − artemia salina (crustaceans), artemia salina (eggs), short-feathered catran, cuniarca (scafarka), jellyfish, motil (chironomid larvae) and puzanok. Limit for the special use of aquatic biological resources in the lower reaches of the Dniester with lakes and the Dniester estuary for crayfish was not established for 2025.'
