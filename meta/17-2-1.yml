SDG_GOAL: 17 Partnership for sustainable development
SDG_TARGET: 17.2 Ensuring the development of partnerships between government and business to achieve the Sustainable Development Goals
SDG_INDICATOR: 17.2.1 Number of public-private partnership projects, units
UNIT_MEASURE: "Units"
CONTACT_ORGANISATION: "Ministry of Economy, Environment and Agriculture of Ukraine"
REC_USE_LIM: ' Number of public-private partnership projects; production, transportation and supply of heat, distribution and supply of natural gas; water supply and drainage; production, distribution, supply, storage, accumulation of electrical energy; transport, transport infrastructure (rail, sea, river, motor, pipeline, aviation, infrastructure of airfields and landing pads, urban electric transport, subway, etc.) and infrastructure of electronic communication networks; health care, public health; tourism, recreation, culture (including management and/or exploitation of architectural monuments and cultural heritage sites) and sports; waste management: On June 19, 2025, the Verkhovna Rada of Ukraine adopted the Law of Ukraine No. 4510-IX "On Public-Private Partnership" (Law No. 4510-IX), which entered into force on October 31, 2025 and in accordance with which the Law of Ukraine No. 2404-VI "On Public-Private Partnership" became invalid. The said Law No. 4510-IX introduces a comprehensive approach to the implementation of the public-private partnership mechanism. This Law, among other things, updates the terminology in the field of public-private partnership (in particular, the term "public-private partnership"). Therefore, the names of the indicator "Number of public-private partnership projects" and the spheres are brought into line with the said Law. <br> Spheres, status of execution: Until 2020, the Ministry of Economy did not hold information on the number of concluded concession agreements, the status of their implementation and areas (The Register of Concession Agreements was transferred by the State Property Fund of Ukraine to the Ministry of Economic Development, Trade and Agriculture of Ukraine at the end of 2019 in accordance with paragraph 8 of Section XII "Final and Transitional Provisions" of the Law of Ukraine dated 03.10.2019 No. 155-IХ "On Concession").'
