SDG_GOAL: 16 Peace, justice and strong institutions
SDG_TARGET: 16.5 Preventing cases of human trafficking and reducing the level of such trafficking and all forms of exploitation
SDG_INDICATOR: 16.5.2 Share of persons who have been granted the status of a victim of trafficking in human beings in the total number of persons who applied for the establishment of such status in the past year, percent
UNIT_MEASURE: "Percent (%)"
CONTACT_ORGANISATION: "National Social Service of Ukraine (NSSU)"
REC_USE_LIM: "2015−2016: Data have been developed since 2017. <br> 2017−2020: Data were compiled based on information from the Ministry of Social Policy, Family and Unity of Ukraine. <br> 2021: Data from the Ministry of Social Policy, Family and Unity and the National Social Service of Ukraine, taking into account the fact that until June 2021, the Ministry of Social Policy, Family and Unity was responsible for establishing statuses, and from June 2021, the National Social Service."
