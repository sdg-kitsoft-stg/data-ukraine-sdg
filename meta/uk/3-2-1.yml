REC_USE_LIM: '2015–2021 роки: Без урахування тимчасово окупованої території Автономної Республіки Крим, м. Севастополя та частини тимчасово окупованих територій у Донецькій та Луганській областях. <br> 2022–2025 роки: Ураховуючи ситуацію, що склалася через військову агресію російської федерації проти України, отримання органами державної статистики адміністративних даних, які є джерелом формування статистичної інформації щодо природного руху населення, у повному обсязі (по кожній адміністративно-територіальній одиниці) із 2022 року є неможливим. Водночас на період запровадження правового режиму воєнного стану в Україні органи державної статистики призупинили формування й оприлюднення даних щодо коефіцієнта материнської смертності, починаючи з 2022 року.'
