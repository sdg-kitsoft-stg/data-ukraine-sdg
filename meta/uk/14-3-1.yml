SDG_GOAL: 14 Збереження морських ресурсів
SDG_TARGET: 14.3 Запровадження ефективного реryлювання видобутку морських біоресурсів
SDG_INDICATOR: 14.3.1 Частка виловлених водних біоресурсів у загальному обсязі встановлених лімітів, відсотків
UNIT_MEASURE: Відсотків (%)
CONTACT_ORGANISATION: Державне агентство України з розвитку меліорації, рибного господарства та продовольчих програм (Держрибагентство)
REC_USE_LIM: 'Примітка: Частка виловлених водних біоресурсів у загальному обсязі встановлених лімітів складає "–" в результаті відсутності вилову водних біоресурсів з тих чи інших обставин, або спосіб використання водних біоресурсів був не лімітований. <br> 2015–2016 роки: Дані розробляються з 2017 року. <br> 2022–2025 роки: Ліміти спеціального використання водних біоресурсів загальнодержавного значення в Азовському морі із затоками для здійснення промислового рибальства та дослідного вилову на 2025 рік не визначались. З 2022 року Азовське море залишається закритим для українського промислу, а незаконний вилов проводять окупанти. Промисел водних біоресурсів в Азовському морі буде можливий лише після деокупації територій. <br> 2022–2025 роки: З 2022 року в зв’язку з введенням воєнного стану в Україні, з метою забезпечення безпеки судноплавства, мінімізації ризиків диверсійних і терористичних загроз з моря та недопущення загибелі чи травмування рибалок і цивільного населення, промислове рибальство в Чорному морі та в частині Дніпровсько-Бузької гирлової системи (в межах Херсонської області) заблоковане. <br> 2024–2025 роки: Ліміти спеціального використання водних біоресурсів загальнодержавного значення в Будацькому (Шаболатському) лимані  для здійснення промислового рибальства та дослідного вилову на 2024−2025 рік не встановлювались. <br> 2022–2025 роки: Ліміти спеціального використання водних біоресурсів загальнодержавного значення в Тузловській групі лиманів для здійснення промислового рибальства та дослідного вилову на 2022−2025 рік не встановлювались. <br> 2025 рік: Відповідно до наказів Мінагрополітики від 31.10.2024  № 4039 "Про затвердження лімітів спеціального використання водних біоресурсів загальнодержавного значення у рибогосподарських водних об’єктах (їх частинах) (крім Азовського та Чорного морів із затоками, причорноморських лиманів, річки Дунай, пониззя річки Дністер (з озерами, рукавом Турунчук) та Дністровського лиману) для здійснення промислового рибальства та дослідного вилову на 2025 рік" та від 31.10.2024 № 4040 "Про затвердження лімітів спеціального використання водних біоресурсів загальнодержавного значення у Чорному морі із затоками, причорноморських лиманах, річці Дунай, пониззі річки Дністер (з озерами, рукавом Турунчук) та Дністровському лимані для здійснення промислового рибальства та дослідного вилову на 2025 рік" водні біоресурси гостроніс, лобань та сингіль зазначені, як кефалеві (гостроніс, лобань, сингіль). <br> Разом з тим, у 2025 році затверджені ліміти спеціального використання водних біоресурсів у Тилігульському лимані по хамсі (чорноморській), у Березанському лимані − тараня (плітка звичайна), хамса (чорноморська) та карась сріблястий, у пониззі Дністра з озерами та Дністровському лимані − атерина піщана та креветка, у Дніпровсько-Бузькій гирловій системі − синець звичайний, у Чорному морі − артемія саліна (рачки), артемія саліна (яйця), катран короткоперий, куніарка (скафарка), медузи, мотиль (личинки хірономід) та пузанок. Ліміт спеціального використання водних біоресурсів у пониззі Дністра з озерами та Дністровському лимані по раках не встановлювався на 2025 рік.'
