SDG_GOAL: 3 Міцне здоров’я і благополуччя
SDG_TARGET: 3.7 Зниження рівня смертності внаслідок нещасних випадків на транспорті шляхом використання інноваційних практик організації реанімування, лікування та реабілітації постраждалих внаслідок таких випадків
SDG_INDICATOR: 3.7.1 Коефіцієнт смертності внаслідок транспортних нещасних випадків, на 100 000 осіб
UNIT_MEASURE: на 100 000 осіб
CONTACT_ORGANISATION: Державна служба статистики України (Держстат)
REC_USE_LIM: '2015–2021 роки: Без урахування тимчасово окупованої території Автономної Республіки Крим, м. Севастополя та даних по Донецькій та Луганській областях. <br>2022–2025 роки: Ураховуючи ситуацію, що склалася через військову агресію російської федерації проти України, отримання органами державної статистики адміністративних даних, які є джерелом формування статистичної інформації щодо природного руху населення, у повному обсязі (по кожній адміністративно-територіальній одиниці) із 2022 року є неможливим. Водночас на період запровадження правового режиму воєнного стану в Україні органи державної статистики призупинили формування й оприлюднення даних щодо коефіцієнта смертності внаслідок транспортних нещасних випадків, починаючи з 2022 року.'
