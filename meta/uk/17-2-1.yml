SDG_GOAL: 17 Партнерство заради сталого розвитку
SDG_TARGET: 17.2 Забезпечення розвитку партнерських відносин влади і бізнесу для досягнення Цілей сталого розвитку
SDG_INDICATOR: 17.2.1 Кількість проектів державно-приватного партнерства, одиниць
UNIT_MEASURE: "Одиниць"
CONTACT_ORGANISATION: "Міністерство економіки, довкілля та сільського господарства України (Мінекономіки)"
REC_USE_LIM: 'Кількість проектів публічно-приватного партнерства; виробництво, транспортування і постачання тепла, розподіл і постачання природного газу; водопостачання та водовідведення; виробництво, розподіл, постачання, зберігання, накопичення електричної енергії; транспорт, транспортна інфраструктура (залізнична, морська, річкова, автомобільна, трубопровідна, авіаційна, інфраструктура аеродромів та злітно-посадкових майданчиків, міського електротранспорту, метрополітену тощо) та інфраструктура електронних комунікаційних мереж; охорона здоров’я, громадське здоров’я; туризм, рекреація, культура (у тому числі управління та/або експлуатація пам’яток архітектури та об’єктами культурної спадщини) та спорт; управління відходами: Верховною Радою України 19.06.2025 було прийнято Закон України № 4510-ІХ "Про публічно-приватне партнерство" (Закон № 4510-ІХ), який набрав чинності 31.10.2025 та відповідно до якого втратив чинність Закон України № 2404-VI "Про державно-приватне партнерство". Зазначений Закон № 4510-ІХ запроваджує комплексний підхід до реалізації механізму публічно-приватного партнерства. Цим Законом серед іншого оновлюється термінологія у сфері публічно-приватного партнерства (зокрема, термін "публічно-приватне партнерство"). Відтак, назви індикатора "Кількість проектів державно-приватного партнерства" та сфери приведено у відповідність до зазначеного Закону. <br> Сфери, стан виконання: До 2020 року Мінекономіки не було держателем інформації щодо кількості укладених концесійних договорів, стану їх виконання та сфер (Реєстр концесійних договорів було передано Фондом державного майна України до Міністерства розвитку економіки, торгівлі та сільського господарства України наприкінці 2019 року на виконання пункту 8 розділу ХІІ "Прикінцеві та перехідні положення" Закону України від 03.10.2019 № 155-ІХ "Про концесію").'
