SDG_GOAL: 3 Healthy lives and well-being
SDG_TARGET: 3.7 Reducing mortality rate from transport accidents by using innovative practices in organizing resuscitation, treatment and rehabilitation of victims of such accidents
SDG_INDICATOR: 3.7.1 Mortality rate due to transport accidents, per 100,000 persons
UNIT_MEASURE: per 100,000 persons
CONTACT_ORGANISATION: State Statistics Service of Ukraine (SSSU)
REC_USE_LIM: '2015–2021: Excluding the temporarily occupied territory of the Autonomous Republic of Crimea, the city of Sevastopol and part of the temporarily occupied territories in Donetsk and Luhansk regions. <br> 2022–2025: Given the situation that has developed due to the military aggression of the russian federation against Ukraine, it has been impossible since 2022 for State Statistics Authorities to obtain administrative data, which are the source of statistical information on the natural population movement, in full (for each administrative-territorial unit). At the same time, for the period during which martial law is in effect in Ukraine, the State Statistics Authorities have suspended the formation and publication of data on the mortality rate due to transport accidents, starting from 2022.'
