SDG_GOAL: 3 Healthy lives and well-being
SDG_TARGET: 3.3 Minimizing preventable mortality among children under 5 years of age
SDG_INDICATOR: 3.3.2 Neonatal mortality rate, per 1,000 live-births
UNIT_MEASURE: per 1,000 live-births
CONTACT_ORGANISATION: State Statistics Service of Ukraine (SSSU)
REC_USE_LIM: '2015–2021: Excluding the temporarily occupied territory of the Autonomous Republic of Crimea, the city of Sevastopol and part of the temporarily occupied territories in Donetsk and Luhansk regions. <br> 2022–2025: Given the situation that has developed due to the military aggression of the russian federation against Ukraine, it has been impossible since 2022 for State Statistics Authorities to obtain administrative data, which are the source of statistical information on the natural population movement, in full (for each administrative-territorial unit). At the same time, for the period during which martial law is in effect in Ukraine, the State Statistics Authorities have suspended the formation and publication of data on the neonatal mortality rate, starting from 2022.'
